type Query {
  """The current user"""
  me: Account!

  """List of countries"""
  countries: [Country!]!

  """List of subjects"""
  subjects: [Subject!]!

  """Retrieve a subject by its id"""
  subject(
    """The id of the subject."""
    id: ID!
  ): Subject

  """List of OpenId clients"""
  openIdClients: [OpenidClient!]!

  """List of languages"""
  languages: [Language!]!

  """Retrieve a course by its slug"""
  course(
    """The slug of the course."""
    slug: String!
  ): Course

  """List of courses created by the teacher"""
  teacherCourses: [Course!]!

  """Retrieve a course to be edited by the teacher."""
  editableCourse(
    """The id of the course."""
    id: ID!
  ): Course

  """Retrieve a program to be edited by the teacher."""
  editableProgram(
    """The id of the program."""
    id: ID!
  ): Program

  """List of subjects that have content associated with them"""
  subjectsWithLinkedContent: [Subject!]!

  """Retrieve a program by its slug"""
  program(
    """The slug of the program."""
    slug: String!
  ): Program

  """List of programs created by the teacher"""
  teacherPrograms: [Program!]!

  """Retrieve the instructor (teacher) account by its id"""
  instructor(
    """The id of the instructor account."""
    id: ID!
  ): Teacher

  """List of paginated teacher accounts."""
  teachers(
    """The number of teachers to return."""
    first: Int! = 20

    """The number of teachers to skip, for pagination."""
    offset: Int! = 0
  ): [Teacher!]!

  """List of courses the user is enrolled in"""
  enrolledCourses: [Course!]!

  """List of courses the user has completed."""
  completedCourses: [Course!]!

  """Aggregated analytics for the authenticated teacher."""
  teacherAnalytics: TeacherAnalytics!

  """
  Detailed analytics for a single course owned by the authenticated teacher.
  """
  courseDetailAnalytics(
    """The id of the course."""
    courseId: ID!
  ): CourseDetailAnalytics

  """
  Returns a single quiz attempt question by its display index. Used for sequential navigation so future questions are never sent to the client.
  """
  quizAttemptQuestion(
    """The ID of the quiz attempt."""
    attemptId: ID!

    """The 0-based display index of the question."""
    index: Int!
  ): QuizAttemptQuestion

  """Active sessions grouped by device/browser."""
  sessionDevices: [SessionDevice!]!
}

"""The properties of the account"""
type Account {
  """A unique id of this account"""
  id: ID!

  """The name of the account"""
  name: String

  """The nickname of the account"""
  nickname: String

  """The first name of the account"""
  first_name: String

  """The last name of the account"""
  last_name: String

  """The gender of the account"""
  gender: Gender

  """The date of birth of this account"""
  date_of_birth: Date

  """The avatar url of this account (provided by the openid-provider)"""
  avatar_url: String

  """The current country the user stated to live in."""
  country: Country

  """The nationality of the user"""
  nationality: Country

  """The preferred language for the account"""
  preferredLanguage: String!

  """The role of the account."""
  accountRole: AccountRole!

  """Represents the subjects a teacher is specialized in for teaching."""
  subjects: [Subject!]!

  """The bio of the teacher."""
  bio: String

  """A detailed overview about this teacher."""
  description: JSON

  """Statistics for the current user."""
  statistics: Statistics

  """
  The social media links of this account (only visible to the account owner).
  """
  socialLinks: [SocialLink!]!
}

"""Gender of the account."""
enum Gender {
  male
  female
  unknown
}

"""Date custom scalar type"""
scalar Date

"""The country info"""
type Country {
  """A unique id of this country"""
  id: ID!

  """The name of this country"""
  denomination: String!

  """The iso code of this country"""
  iso: String!

  """The iso3 code of this country"""
  iso3: String

  """The num_code code of this country"""
  num_code: String

  """The phone_code code of this country"""
  phone_code: String!
}

"""The role of the account."""
enum AccountRole {
  teacher
  student
}

"""The subject info"""
type Subject {
  """A unique id of this subject."""
  id: ID!

  """The name of this subject."""
  denomination: String!

  """The courses linked to this subject."""
  courses: [Course!]!

  """The programs linked to this subject."""
  programs: [Program!]!
}

"""The course info."""
type Course {
  """A unique id of this course."""
  id: ID!

  """The denomination of this course."""
  denomination: String!

  """A unique slug of this course."""
  slug: String!

  """The subtitle of this course."""
  subtitle: String!

  """The description of this course."""
  description: JSON!

  """The difficulty level of this course."""
  level: CourseLevel!

  """A link to an external resource."""
  external_resource_link: String

  """A flag to indicate whether this course is published or not"""
  is_published: Boolean!

  """The image of this course"""
  image: String

  """The language of this course"""
  language: String!

  """The start date of the course"""
  start_date: Date

  """The end date of the course"""
  end_date: Date

  """The date of when this course was created."""
  created_at: Date!

  """The date of when this course was last updated."""
  updated_at: Date!

  """The status of the course for the current user"""
  status: CourseStatus!

  """
  The progress of the current user through the course. Null when the user is not enrolled (or not completed) in this course.
  """
  progress: CourseProgress

  """The subjects linked to this course."""
  subjects: [Subject!]!

  """The objectives of this course."""
  objectives: [CourseObjective!]!

  """The requirements of this course."""
  requirements: [CourseRequirement!]!

  """The sections of this course."""
  sections: [CourseSection!]!

  """Average star rating for this course"""
  rating: Float!

  """Total number of ratings for this course"""
  ratingsCount: Int!

  """The reviews of this course."""
  reviews: [CourseReview!]!

  """Review by the current viewer for this course"""
  viewerReview: CourseReview

  """The name of the instructor for this course"""
  instructor: Teacher!

  """The number of participants enrolled in this course (or completed it)"""
  participationCount: Int!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

"""The difficulty level of a course."""
enum CourseLevel {
  beginner
  intermediate
  advanced
}

"""The status of the course for the current user."""
enum CourseStatus {
  """This course is available for enrollment."""
  available

  """The user is currently enrolled in this course."""
  enrolled

  """The user unenrolled from this course."""
  unenrolled

  """This course has been completed by the user."""
  completed
}

"""The progress of the current user through a course."""
type CourseProgress {
  """
  The number of completed content components plus passed quizzes (a quiz counts as one unit).
  """
  completedComponents: Int!

  """
  The total number of published content components plus published quizzes (a quiz counts as one unit).
  """
  totalComponents: Int!

  """The course progress as a percentage from 0 to 100."""
  progressPercentage: Float!

  """
  True when every unit is completed, i.e. the course completion gate would pass (0 when the course has no content).
  """
  isCompleted: Boolean!
}

"""The course objective info"""
type CourseObjective {
  """A unique id of this course objective."""
  id: ID!

  """The objective of this course."""
  objective: String!
}

"""The course requirement info"""
type CourseRequirement {
  """A unique id of this course requirement."""
  id: ID!

  """The requirement of this course."""
  requirement: String!
}

"""The course section info"""
type CourseSection {
  """A unique id of this course section."""
  id: ID!

  """The denomination of this course section"""
  denomination: String!

  """A flag to indicate whether this course section is published or not"""
  is_published: Boolean!

  """The rank of this course section"""
  rank: Int!

  """The course section items"""
  items: [CourseSectionItem!]!
}

"""
Course section item which contains the course curriculum (e.g. lesson, quiz)
"""
union CourseSectionItem = Lesson | Quiz

"""The lesson info"""
type Lesson {
  """A unique id of this lesson."""
  id: ID!

  """The ID of the section item this lesson belongs to."""
  itemId: ID!

  """The denomination of this lesson."""
  denomination: String!

  """The duration of this lesson."""
  duration: Int!

  """A flag to indicate whether this lesson is published or not"""
  is_published: Boolean!

  """The content components of this lesson."""
  components: [ContentComponent!]!
}

"""A content component which can be of various types."""
union ContentComponent = TextContent | VideoContent | YouTubeContent | AudioContent | DocumentContent | EmbedContent | ImageContent

"""A text content component."""
type TextContent {
  """A unique id of this text content component."""
  id: ID!

  """The text content."""
  content: JSON!

  """The id of the component this text content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""The type of the component."""
enum ComponentType {
  text
  video
  youtube
  audio
  document
  embed
  image
}

"""Progress tracking for content components"""
type ContentComponentProgress {
  """The unique identifier of the progress record"""
  id: ID!

  """The content component ID"""
  content_component_id: Int!

  """Flag to indicate if the content component is completed"""
  is_completed: Boolean!

  """When the component was completed"""
  completed_at: Date
}

"""A video content component."""
type VideoContent {
  """A unique id of this video content component."""
  id: ID!

  """The URL of the video."""
  url: String!

  """The id of the component this video content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""A YouTube content component."""
type YouTubeContent {
  """A unique id of this video content component."""
  id: ID!

  """The YouTube video id."""
  youtube_video_id: String!

  """The description of the YouTube."""
  description: JSON

  """The id of the component this video content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""An audio content component."""
type AudioContent {
  """A unique id of this audio content component."""
  id: ID!

  """The URL of the audio file."""
  url: String!

  """The original file name of the audio."""
  original_name: String

  """The MIME type of the audio file."""
  mime_type: String

  """The id of the component this audio content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""A document content component (e.g. PDF)."""
type DocumentContent {
  """A unique id of this document content component."""
  id: ID!

  """The URL of the document."""
  url: String!

  """The original file name of the document."""
  original_name: String

  """The MIME type of the document file."""
  mime_type: String

  """The id of the component this document content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""An embedded content component (e.g. Loom, Vimeo, Slides, CodePen)."""
type EmbedContent {
  """A unique id of this embed content component."""
  id: ID!

  """The provider of the embedded content."""
  provider: String!

  """The URL of the embedded content."""
  url: String!

  """The id of the component this embed content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""An image content component."""
type ImageContent {
  """A unique id of this image content component."""
  id: ID!

  """The URL of the image file."""
  url: String!

  """The original file name of the image."""
  original_name: String

  """The MIME type of the image file."""
  mime_type: String

  """The alternative text of the image."""
  alt_text: String

  """The caption of the image."""
  caption: String

  """The id of the component this image content belongs to."""
  component_id: ID!

  """The denomination of the component."""
  denomination: String!

  """The type of the component."""
  type: ComponentType!

  """A flag indicating whether the component is required to continue."""
  is_required: Boolean!

  """A flag indicating whether the component is published"""
  is_published: Boolean!

  """The rank of the component"""
  rank: Int!

  """The progress of this component for the current user"""
  progress: ContentComponentProgress
}

"""The quiz info"""
type Quiz {
  """A unique id of this quiz."""
  id: ID!

  """The ID of the section item this quiz belongs to."""
  itemId: ID!

  """The denomination of this quiz."""
  denomination: String!

  """A flag to indicate whether this quiz is published or not."""
  is_published: Boolean!

  """The passing score in percentage."""
  passing_score: Int!

  """The maximum number of allowed attempts."""
  max_attempts: Int!

  """A flag to indicate whether the question order is shuffled per attempt."""
  shuffle_questions: Boolean!

  """A flag to indicate whether the answer order is shuffled per attempt."""
  shuffle_answers: Boolean!

  """How students navigate through the questions."""
  navigation_mode: QuizNavigationMode!

  """The number of questions shown per page (0 means all on one page)."""
  questions_per_page: Int!

  """
  Whether the correct answers are revealed to the student after submission.
  """
  show_correct_answers: Boolean!

  """The time limit in minutes, null means no limit."""
  time_limit_minutes: Int

  """The overall feedback shown when the quiz is passed."""
  feedback_passed: String

  """The overall feedback shown when the quiz is failed."""
  feedback_failed: String

  """The questions of this quiz (only visible to the quiz owner)."""
  questions: [QuizQuestion!]!

  """
  Whether the current user has a completed attempt that passed this quiz.
  """
  passed: Boolean

  """The attempts of the current user for this quiz."""
  attempts: [QuizAttempt!]!
}

"""How students navigate through the questions of a quiz."""
enum QuizNavigationMode {
  free
  sequential
}

"""A question of a quiz."""
type QuizQuestion {
  """A unique id of this question."""
  id: ID!

  """The text of the question."""
  prompt: String!

  """The type of the question."""
  question_type: QuizQuestionType!

  """The points awarded for answering this question correctly."""
  points: Int!

  """The rank of this question within the quiz."""
  rank: Int!

  """The URL of the media attached to this question."""
  media_url: String

  """The type of media attached to this question."""
  media_type: QuizQuestionMediaType

  """An optional hint shown to students on demand."""
  hint: String

  """The difficulty level of this question."""
  difficulty: QuizQuestionDifficulty

  """The learning objective this question targets."""
  learning_objective: String

  """The feedback shown when this question is answered correctly."""
  feedback_correct: String

  """The feedback shown when this question is answered incorrectly."""
  feedback_incorrect: String

  """The answer options of this question."""
  answers: [QuizAnswer!]!
}

"""The type of a quiz question."""
enum QuizQuestionType {
  single_choice
  multi_select
  true_false
}

"""The type of media attached to a quiz question."""
enum QuizQuestionMediaType {
  image
  video
}

"""The difficulty level of a quiz question."""
enum QuizQuestionDifficulty {
  easy
  medium
  hard
}

"""An answer option of a quiz question."""
type QuizAnswer {
  """A unique id of this answer."""
  id: ID!

  """The text of this answer option."""
  denomination: String

  """The URL of the image of this answer option."""
  image_url: String

  """
  Whether this answer is correct (only visible to the teacher who owns the quiz).
  """
  is_correct: Boolean

  """The rank of this answer within the question."""
  rank: Int!
}

"""An attempt of a quiz taken by a student."""
type QuizAttempt {
  """A unique id of this attempt."""
  id: ID!

  """The ID of the quiz this attempt belongs to."""
  quizId: ID!

  """The ID of the account that took the attempt."""
  accountId: ID!

  """The ID of the enrollment this attempt belongs to."""
  enrollmentId: ID!

  """The 1-based number of this attempt for the account."""
  attempt_number: Int!

  """The status of this attempt."""
  status: QuizAttemptStatus!

  """The score in percentage, null while the attempt is in progress."""
  score: Int

  """The points earned, null while the attempt is in progress."""
  earned_points: Int

  """The total points available, null while the attempt is in progress."""
  total_points: Int

  """Whether the attempt passed the quiz, null while in progress."""
  passed: Boolean

  """Whether the attempt was submitted after the time limit."""
  timed_out: Boolean!

  """When the attempt was started (server time)."""
  started_at: Date!

  """When the attempt was submitted."""
  submitted_at: Date

  """The snapshot of the questions as seen by the student."""
  questions: [QuizAttemptQuestion!]!

  """
  The number of questions in this attempt. Useful for sequential navigation without revealing the questions themselves.
  """
  questionCount: Int!
}

"""The status of a quiz attempt."""
enum QuizAttemptStatus {
  in_progress
  completed
}

"""A snapshot of a quiz question as the student saw it."""
type QuizAttemptQuestion {
  """A unique id of this attempt question snapshot."""
  id: ID!

  """The ID of the original question, null if it was deleted since."""
  questionId: ID

  """The text of the question as seen by the student."""
  prompt: String!

  """The type of the question."""
  question_type: QuizQuestionType!

  """The order of this question within the attempt as displayed."""
  rank: Int!

  """The points this question was worth."""
  points: Int!

  """The URL of the media attached to this question."""
  media_url: String

  """The type of media attached to this question."""
  media_type: QuizQuestionMediaType

  """The hint of this question."""
  hint: String

  """The difficulty of this question."""
  difficulty: QuizQuestionDifficulty

  """The learning objective of this question."""
  learning_objective: String

  """The feedback shown when answered correctly."""
  feedback_correct: String

  """The feedback shown when answered incorrectly."""
  feedback_incorrect: String

  """
  The answer options as displayed. The correctness of each answer is only revealed once the attempt is completed.
  """
  answers: JSON!

  """The answers selected by the student for this question."""
  selectedAnswers: [QuizAttemptAnswer!]!
}

"""An answer selected by the student in a quiz attempt."""
type QuizAttemptAnswer {
  """A unique id of this attempt answer."""
  id: ID!

  """The ID of the attempt question snapshot this answer belongs to."""
  attemptQuestionId: ID!

  """The ID of the original answer, null if it was deleted since."""
  answerId: ID

  """The text of the answer as the student saw it."""
  denomination: String

  """The image of the answer as the student saw it."""
  image_url: String

  """Whether the selected answer was correct at grading time."""
  is_correct: Boolean!
}

"""The review details of a course"""
type CourseReview {
  """Id of this course review"""
  id: ID!

  """1-5 star rating value given by the reviewer"""
  rating: Float

  """The review text given by the reviewer"""
  review: String

  """The reviewer who wrote the review"""
  reviewer: PublicAccount!

  """Whether the review can be edited by the user"""
  isEditable: Boolean!

  """The date when the review was created"""
  created_at: Date!
}

"""The properties of a public account"""
type PublicAccount {
  """A unique id of this account"""
  id: ID!

  """The name of the account"""
  name: String

  """The nickname of the account"""
  nickname: String

  """The first name of the account"""
  first_name: String

  """The last name of the account"""
  last_name: String

  """The avatar url of this account"""
  avatar_url: String
}

"""The properties of a teacher account"""
type Teacher {
  """A unique id of this account"""
  id: ID!

  """The name of the teacher"""
  name: String

  """The nickname of the teacher"""
  nickname: String

  """The first name of the teacher"""
  first_name: String

  """The last name of the teacher"""
  last_name: String

  """The avatar url of this teacher"""
  avatar_url: String

  """A short biography of the teacher"""
  bio: String

  """A detailed description of the teacher"""
  description: JSON

  """Indicates if the current user is following this teacher"""
  isFollowed: Boolean!

  """
  Checks if the current user can follow this teacher (blocks self-follow).
  """
  isAllowedToFollow: Boolean!

  """The number of followers this teacher has"""
  followersCount: Int!

  """The public social media links of this teacher."""
  socialLinks: [SocialLink!]!

  """Represents the subjects a teacher is specialized in for teaching."""
  subjects: [Subject!]!

  """List of courses created by the teacher"""
  courses: [Course!]!

  """List of programs created by the teacher"""
  programs: [Program!]!
}

"""A social media link attached to an account."""
type SocialLink {
  """A unique id of this social link."""
  id: ID!

  """
  The platform identifier (linkedin, x, youtube, github, instagram, facebook, tiktok, website).
  """
  platform: String!

  """Human-readable platform name."""
  platformDisplayName: String!

  """
  The username/handle on the platform (without leading @), if applicable.
  """
  userName: String

  """
  Optional custom label chosen by the user. Falls back to the handle or platform name in UIs when absent.
  """
  displayName: String

  """The full https URL of the social profile."""
  url: String!

  """Whether this is the highlighted main link of the account."""
  isPrimary: Boolean!
}

"""The program info."""
type Program {
  """A unique id of this program."""
  id: ID!

  """The denomination of this program."""
  denomination: String!

  """A unique slug of this program."""
  slug: String!

  """The subtitle of this program."""
  subtitle: String!

  """The description of this program."""
  description: JSON!

  """The difficulty level of this program."""
  level: ProgramLevel!

  """A flag to indicate whether this program is published or not."""
  is_published: Boolean!

  """The image of this program."""
  image: String

  """The date of when this program was created."""
  created_at: Date!

  """The date of when this program was last updated."""
  updated_at: Date!

  """The subjects linked to this program."""
  subjects: [Subject!]!

  """The objectives of this program."""
  objectives: [ProgramObjective!]!

  """The requirements of this program."""
  requirements: [ProgramRequirement!]!

  """The status of the program for the current user."""
  status: ProgramStatus!

  """
  The relevant program version for the current user. Returns the draft version for the owning teacher, the enrolled version for an enrolled student, and the latest published version for everyone else.
  """
  currentVersion: ProgramVersion!

  """
  The version the owning teacher should edit. Returns the current draft if one exists, otherwise the latest published version.
  """
  editableVersion: ProgramVersion!

  """The latest program version number."""
  latestVersionNumber: Int

  """Number of learners currently enrolled in this program."""
  enrolledLearnersCount: Int!

  """The instructor of this program."""
  instructor: Teacher!
}

"""The difficulty level of a program."""
enum ProgramLevel {
  beginner
  intermediate
  advanced
}

"""The program objective info"""
type ProgramObjective {
  """A unique id of this program objective."""
  id: ID!

  """The objective of this program."""
  objective: String!
}

"""The program requirement info"""
type ProgramRequirement {
  """A unique id of this program requirement."""
  id: ID!

  """The requirement of this program."""
  requirement: String!
}

"""The status of the program for the current user."""
enum ProgramStatus {
  """This program is not started yet."""
  not_started

  """The user is currently in progress in this program."""
  in_progress

  """This program has been completed by the user."""
  completed
}

"""A versioned snapshot of a program's course list."""
type ProgramVersion {
  """A unique id of this program version."""
  id: ID!

  """The ID of the program this version belongs to."""
  program_id: ID!

  """The sequential version number of this program version."""
  version_number: Int!

  """The lifecycle status of this program version."""
  status: ProgramVersionStatus!

  """The date this version was published. Null if not yet published."""
  published_at: Date

  """The date this program version was created."""
